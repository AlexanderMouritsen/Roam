<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trips · Roam</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/trips.css" />
  <script src="/js/trips.js" defer></script>
</head>
<body>

  <!-- Navbar (same structure as dashboard) -->
  <nav class="navbar">
    <div class="navbar-left">
      <span class="navbar-logo">Roam</span>
      <div class="navbar-links">
        <a href="/"       class="navbar-link">Map</a>
        <a href="/trips"  class="navbar-link active">Trips</a>
        <a href="#"       class="navbar-link">Bucket</a>
        <a href="#"       class="navbar-link">Stats</a>
      </div>
    </div>
    <div class="navbar-right">
      <div class="user-menu" id="user-menu">
        <div class="user-avatar" id="user-avatar"></div>
        <div class="user-info">
          <span class="user-display-name" id="user-display-name">—</span>
          <span class="user-username"     id="user-username">—</span>
        </div>
        <svg class="chevron" id="menu-chevron" viewBox="0 0 16 16" fill="none">
          <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="user-dropdown" id="user-dropdown" hidden>
        <a href="#" class="dropdown-item">Settings</a>
        <hr class="dropdown-divider" />
        <button class="dropdown-item dropdown-item-danger" id="logout-btn">Log out</button>
      </div>
    </div>
  </nav>

  <!-- Page header -->
  <main class="main-content">
    <div class="page-header">
      <div class="page-header-left">
        <h1>Your trips</h1>
        <p>All your journeys in one place.</p>
      </div>
      <button class="btn btn-primary" id="new-trip-btn">+ New trip</button>
    </div>

    <!-- Filters -->
    <div class="filters-row">
      <div class="filter-group">
        <select class="input input-select filter-select" id="filter-status">
          <option value="all">All trips</option>
          <option value="planned">Planned</option>
          <option value="ongoing">Ongoing</option>
          <option value="completed">Completed</option>
        </select>

        <select class="input input-select filter-select" id="filter-sort">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
        </select>
      </div>

      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 16 16" fill="none">
          <circle cx="6.5" cy="6.5" r="4" stroke="currentColor" stroke-width="1.5"/>
          <path d="M11 11l2.5 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input class="input search-input" type="text" id="search-input"
               placeholder="Search trips…" autocomplete="off" />
      </div>
    </div>

    <!-- Trip grid -->
    <div class="trips-grid" id="trips-grid"></div>

    <!-- Empty state (hidden until we know there are no trips) -->
    <div class="empty-state" id="empty-state" hidden>
      <div class="empty-state-icon">✦</div>
      <h2>No trips yet</h2>
      <p>Start by adding your first journey.</p>
      <button class="btn btn-primary" id="empty-new-trip-btn">+ New trip</button>
    </div>

    <!-- No results state (hidden by default) -->
    <div class="empty-state" id="no-results-state" hidden>
      <div class="empty-state-icon">⊘</div>
      <h2>No trips match your search</h2>
      <p>Try a different filter or search term.</p>
    </div>
  </main>

  <!-- New trip modal -->
  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" id="trip-modal">
      <div class="modal-header">
        <h2 id="modal-title">New trip</h2>
        <button class="modal-close" id="modal-close" type="button">
          <svg viewBox="0 0 16 16" fill="none" width="16" height="16">
            <path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="field">
          <label class="field-label" for="trip-title">Title <span class="field-required">*</span></label>
          <input class="input" type="text" id="trip-title"
                 placeholder="e.g. Japan 2026" maxlength="100" />
        </div>

        <div class="field">
          <label class="field-label" for="trip-country">Country <span class="field-required">*</span></label>
          <div class="country-picker" id="trip-country-picker">
            <input class="input" type="text" id="trip-country-search"
                   placeholder="Search for a country…" autocomplete="off" />
            <input type="hidden" id="trip-country-code" />
            <ul class="country-list" id="trip-country-list" hidden></ul>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label class="field-label" for="trip-start-date">Start date</label>
            <input class="input" type="text" id="trip-start-date" placeholder="DD/MM/YYYY" />
          </div>
          <div class="field">
            <label class="field-label" for="trip-end-date">End date</label>
            <input class="input" type="text" id="trip-end-date" placeholder="DD/MM/YYYY" />
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="trip-status">Status</label>
          <select class="input input-select" id="trip-status">
            <option value="planned">Planned</option>
            <option value="ongoing">Ongoing</option>
            <option value="completed">Completed</option>
          </select>
        </div>

        <div class="field">
          <label class="field-label" for="trip-description">Description</label>
          <textarea class="input" id="trip-description"
                    placeholder="What was this trip about?" rows="3" maxlength="1000"></textarea>
        </div>

        <div class="field">
          <label class="field-label" for="trip-cover-file">Cover photo</label>
          <div class="file-input">
            <button class="file-input-btn" type="button" id="trip-cover-btn">Upload a picture</button>
            <span class="file-input-name" id="trip-cover-name">No file selected</span>
            <input class="file-input-native" type="file" id="trip-cover-file" accept="image/*" />
          </div>
        </div>

        <div class="message message-error" id="trip-error"></div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-cancel" type="button">Cancel</button>
        <button class="btn btn-primary"   id="trip-submit" type="button">Create trip</button>
      </div>
    </div>
  </div>

</body>
</html>
